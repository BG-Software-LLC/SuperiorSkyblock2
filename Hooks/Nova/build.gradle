group 'Hooks:Nova'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven { url 'https://repo.xenondevs.xyz/releases' }
}

dependencies {
    compileOnly 'xyz.xenondevs.nova:nova-api:0.24.0'
    compileOnly 'org.spigotmc:v1_16_R3-Tuinity:latest'
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_nova') &&
        !Boolean.valueOf(project.findProperty("hook.compile_nova").toString())) {
    project.tasks.all { task -> task.enabled = false }
}