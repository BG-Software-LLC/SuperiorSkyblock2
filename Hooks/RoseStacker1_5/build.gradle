group 'Hooks:RoseStacker1_5'

// RoseStacker 1.5+ is compiled for Java 17 and exposes the spawning API
// (PreStackedSpawnerSpawnEvent, StackedSpawnerTile#getSpawnedType) that older
// versions lack, so this module is built with a Java 17 toolchain.
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

dependencies {
    compileOnly 'dev.rosewood:RoseStacker:1.5.33'
    compileOnly "org.spigotmc:v1_8_R3-Taco:latest"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_rosestacker1_5') &&
        !Boolean.valueOf(project.findProperty("hook.compile_rosestacker1_5").toString())) {
    project.tasks.all { task -> task.enabled = false }
}
