group 'Hooks:mcMMO'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.enginehub.org/repo/' }
    maven { url 'https://nexus.neetgames.com/repository/maven-public' }
}

dependencies {
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.7'
    compileOnly 'com.gmail.nossr50.mcMMO:mcMMO:2.3.001-SNAPSHOT'
    compileOnly 'org.spigotmc:v1_8_R3-Taco:latest'
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_mcmmo') &&
        !Boolean.valueOf(project.findProperty("hook.compile_mcmmo").toString())) {
    project.tasks.all { task -> task.enabled = false }
}