title: '&lIsland Warps'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ ~ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

sort-islands: '~'

messages:
  selected-sorting-type: '&8 - &a{0}'
  unselected-sorting-type: '&8 - &7{0}'

items:
  '@':
    type: SKULL_ITEM
    data: 3
    name: '&e{0}''s Island'
    lore:
      - '&7This island has {2} warps.'
      - ''
      - '&7&o(( &f&oClick &7&oto see all warps of this island. ))'
  '~':
    BANK:
      display-name: 'Bank'
      type: EMERALD
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch top islands sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
    LEVEL:
      display-name: 'Level'
      type: GOLD_INGOT
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch top islands sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
    PLAYERS:
      display-name: 'Players'
      type: SKULL_ITEM
      data: 3
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch top islands sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
    RATING:
      display-name: 'Rating'
      type: NETHER_STAR
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch top islands sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
    WORTH:
      display-name: 'Worth'
      type: DIAMOND
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch top islands sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: DOUBLE_PLANT
    name: '&aCurrent Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'
  '$':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&f'

sounds:
  '@':
    type: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '~':
    type: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.2
    pitch: 0.2