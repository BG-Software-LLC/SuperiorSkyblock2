title: '&lIsland Biomes'
previous-menu: true

pattern:
  - '# # # # # # # # #'
  - '# @ @ @ @ @ @ @ #'
  - '# @ @ @ @ @ @ @ #'
  - '# @ @ @ @ @ @ @ #'
  - '$ $ $ $ $ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

# Whether the item of the currently selected biome should glow.
current-biome-glow: false

# Whether players should be able to change biomes only in default dimension.
# When disabled, players will be able to specify the dimension as a command argument
# or select it via the dimension-selection menu.
only-default-dimension: true

items:
  '$':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&f'
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: DOUBLE_PLANT
    name: '&aCurrent Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'

