title: '&lTransaction Logs &r{0}'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ ! $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

sort-logs: '!'

messages:
  selected-sorting-type: '&8 - &a{0}'
  unselected-sorting-type: '&8 - &7{0}'

items:
  '@':
    type: PAPER
    name: '&eTransaction #{0}'
    lore:
      - '&7Player: {1}'
      - '&7Status: {2}'
      - '&7Time: {3}'
      - '&7Amount: ${4}'
      - ''
      - '&7Click to filter transactions by this player.'
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: DOUBLE_PLANT
    name: '&aCurrent Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'
  '$':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&f'
  '!':
    TIME:
      display-name: 'Creation time'
      type: WATCH
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch transaction logs sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
        - ''
        - '&7Left-click for the previous sorting type.'
        - '&7Right-click for the next sorting type.'
    MONEY:
      display-name: 'Money'
      type: EMERALD
      name: '&6Switch Sorting Type'
      lore:
        - '&7Switch transaction logs sorting type.'
        - '&7Sorting Type: &e{1}&7.'
        - ''
        - '{0}'
        - ''
        - '&7Left-click for the previous sorting type.'
        - '&7Right-click for the next sorting type.'

sounds:
  '@':
    type: BLOCK_CHEST_OPEN
    volume: 0.8
    pitch: 1