title: '&lWarp Categories'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ $ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

# Lore that will be appended to the end of the warp category icon's lore
# if the player has permission to manage that warp category.
edit-lore:
  - ''
  - ''
  - '&7&o(( &f&oRight-Click &7&oto edit the category. ))'

items:
  '@':
    type: BOOK
    name: '&6{0}'
    lore:
      - '&7This category has {1} warps.'
  '%':
    type: PAPER
    name: '&cPrevious Page'
  '*':
    type: SUNFLOWER
    name: '&aCurrent Page'
    lore:
      - '&7Page 1'
  '^':
    type: PAPER
    name: '&cNext Page'
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'

sounds:
  '@':
    type: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.2
    pitch: 0.2