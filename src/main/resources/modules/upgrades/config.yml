# Whether the module should be enabled.
# When disabled, all module commands and features will also be disabled.
enabled: true

# Settings related to crop growth multiplier.
crop-growth:
  # Whether crop growth multiplier should be enabled.
  # When disabled, the plugin will not alter crop growth.
  enabled: true

  # How frequency should the crops task run? (in ticks)
  # When the value is non-positive, the multiplier will not work.
  interval: 5

  # List of whitelisted crops that will be affected by the crop growth multiplier.
  # You can find a list of materials here: https://bg-software.com/materials/
  whitelisted-crops:
    - 'SAPLING'
    - 'OAK_SAPLING'
    - 'SPRUCE_SAPLING'
    - 'BIRCH_SAPLING'
    - 'JUNGLE_SAPLING'
    - 'ACACIA_SAPLING'
    - 'DARK_OAK_SAPLING'
    - 'MANGROVE_PROPAGULE'
    - 'CHERRY_SAPLING'
    - 'PALE_OAK_SAPLING'
    - 'BROWN_MUSHROOM'
    - 'RED_MUSHROOM'
    - 'BAMBOO'
    - 'BAMBOO_SAPLING'
    - 'SUGAR_CANE_BLOCK'
    - 'SUGAR_CANE'
    - 'CACTUS'
    - 'WEEPING_VINES'
    - 'TWISTING_VINES'
    - 'VINE'
    - 'CHORUS_FLOWER'
    - 'WHEAT'
    - 'COCOA'
    - 'PUMPKIN_STEM'
    - 'ATTACHED_PUMPKIN_STEM'
    - 'MELON_STEM'
    - 'ATTACHED_MELON_STEM'
    - 'BEETROOTS'
    - 'TORCHFLOWER_CROP'
    - 'PITCHER_CROP'
    - 'CAVE_VINES'
    - 'SWEET_BERRY_BUSH'
    - 'NETHER_WART'
    - 'NETHER_WARTS'
    - 'KELP'
    - 'CARROT'
    - 'CARROTS'
    - 'POTATO'
    - 'POTATOES'
    - 'CROPS'

# Settings related to mob drops multiplier.
mob-drops:
  # Whether mob drops multiplier should be enabled.
  # When disabled, the plugin will not alter mob drops.
  enabled: true

  # Should mob drops multiplier will only multiply drops of entities that were killed by players.
  only-player-kills: false

  # List of whitelisted items that will be multiplied.
  # You can disable this feature by setting the section to 'whitelisted-items: []'
  whitelisted-items: [ ]

  # List of blacklisted items that won't be multiplied.
  # You can disable this feature by setting the section to 'blacklisted-items: []'
  blacklisted-items: [ ]

  # List of whitelisted entities whose drops will be multiplied.
  # You can disable this feature by setting the section to 'whitelisted-entities: []'
  whitelisted-entities: [ ]

  # List of blacklisted entities whose drops won't be multiplied.
  # You can disable this feature by setting the section to 'blacklisted-entities: []'
  blacklisted-entities: [ ]

# Whether spawner rates multiplier should be enabled.
# When disabled, the plugin will not alter spawner rates.
spawner-rates: true

# Whether island effects should be enabled.
# When disabled, the plugin will not give any effects to any players.
island-effects: true

# Whether block limits should be enabled.
# When disabled, the plugin will not limit placement of blocks.
block-limits: true

# Whether entity limits should be enabled.
# When disabled, the plugin will not limit spawning of entities.
entity-limits: true

