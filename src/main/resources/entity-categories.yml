# Configure the categories of entities of the plugin.
# The format for category is as so:
# <CATEGORY_NAME>:
#   entities:
#     - <ENTITIES...>
#   actions:
#     # The privilege required to spawn the entities using spawn eggs
#     SPAWN: <ISLAND_PRIVILEGE>
#     # The privilege required to damage the entities
#     DAMAGE: <ISLAND_PRIVILEGE>
#     # The privilege required to interact with the entities
#     INTERACT: <ISLAND_PRIVILEGE>
#     # The island flag required so the entities can spawn from spawners
#     SPAWNER_SPAWN: <ISLAND_FLAG>
#     # The island flag required so the entities can spawn vanilla
#     NATURAL_SPAWN: <ISLAND_FLAG>
# Important: Entities can belong to multiple categories at the same time. In that case, the
# corresponding action may require a privilege or flag from each category.

# Built-in categories.
# These categories are provided by the plugin and will always exist.
# Unlike custom categories, they do not have a 'entities' list, as their entities are
# populated automatically based on the server version.
# You can use 'skipped-entities' to exclude specific entities from a built-in category.
builtin-categories:
  TAMEABLE:
    skipped-entities: [ ]
    actions:
      DAMAGE: TAMED_ANIMAL_DAMAGE

  VEHICLE:
    skipped-entities: [ ]
    actions:
      SPAWN: MINECART_PLACE
      DAMAGE: MINECART_DAMAGE

  ANIMAL:
    skipped-entities: [ ]
    actions:
      SPAWN: ANIMAL_SPAWN
      DAMAGE: ANIMAL_DAMAGE
      SPAWNER_SPAWN: SPAWNER_ANIMALS_SPAWN
      NATURAL_SPAWN: NATURAL_ANIMALS_SPAWN

  MONSTER:
    skipped-entities: [ ]
    actions:
      SPAWN: MONSTER_SPAWN
      DAMAGE: MONSTER_DAMAGE
      SPAWNER_SPAWN: SPAWNER_MONSTER_SPAWN
      NATURAL_SPAWN: NATURAL_MONSTER_SPAWN

# Custom categories.
# These categories can be freely modified or removed. You can also create your own.
custom-categories:
  ALLAY:
    entities:
      - ALLAY
    actions:
      INTERACT: ALLAY_INTERACT

  AXOLOTL:
    entities:
      - AXOLOTL
    actions:
      INTERACT: PICKUP_AXOLOTL

  COPPER_GOLEM:
    entities:
      - COPPER_GOLEM
    actions:
      INTERACT: COPPER_GOLEM_INTERACT

  FISH:
    entities:
      - COD
      - PUFFERFISH
      - SALMON
      - TADPOLE
      - TROPICAL_FISH
    actions:
      INTERACT: PICKUP_FISH

  HORSES:
    entities:
      - CAMEL
      - CAMEL_HUSK
      - DONKEY
      - HORSE
      - LLAMA
      - MULE
      - SKELETON_HORSE
      - TRADER_LLAMA
      - ZOMBIE_HORSE
    actions:
      INTERACT: HORSE_INTERACT

  NAUTILUS:
    entities:
      - NAUTILUS
      - ZOMBIE_NAUTILUS
    actions:
      INTERACT: NAUTILUS_INTERACT

  VILLAGERS:
    entities:
      - VILLAGER
    actions:
      INTERACT: VILLAGER_TRADING

  ARMOR_STAND:
    entities:
      - ARMOR_STAND
    actions:
      SPAWN: BUILD
      DAMAGE: BREAK
      INTERACT: BUILD

  ITEM_FRAME:
    entities:
      - GLOW_ITEM_FRAME
      - ITEM_FRAME
    actions:
      SPAWN: ITEM_FRAME
      DAMAGE: ITEM_FRAME
      INTERACT: ITEM_FRAME

  PAINTING:
    entities:
      - PAINTING
    actions:
      SPAWN: PAINTING
      DAMAGE: PAINTING
      INTERACT: PAINTING