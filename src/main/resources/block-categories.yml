# Configure the categories of blocks of the plugin.
# The format of the file is as so:
# <CATEGORY_NAME>:
#   blocks:
#     - <BLOCKS...>
#   actions:
#     # The privilege required to place the blocks.
#     PLACE: <ISLAND_PRIVILEGE>
#     # The privilege required to break the blocks.
#     BREAK: <ISLAND_PRIVILEGE>
#     # The privilege required to interact with the blocks.
#     INTERACT: <ISLAND_PRIVILEGE>
# You can create as many custom categories as you want, blocks can be in several categories at the same time,
# then they will require a privilege from each category for a given action.
# There's also a built-in category used to detect all blocks. It doesn't have a 'blocks' list,
# because blocks are added to it automatically, but it does have a 'skipped-blocks' list,
# so you can remove default blocks from it if you don't want the action to require multiple privileges.

# Built-in categories
ALL:
  skipped-blocks: []
  actions:
    PLACE: BUILD
    BREAK: BREAK

