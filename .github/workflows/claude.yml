name: Claude Issue Fixer
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  claude-fix:
    if: contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude Fixer
        uses: anthropics/claude-code-action@01e756b34ef7a1447e9508f674143b07d20c2631
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          command: "fix-issue ${{ github.event.issue.number }}"