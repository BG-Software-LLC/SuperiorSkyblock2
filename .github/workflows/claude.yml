name: Claude Issue Fixer
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  claude-fix:
    if: contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run Claude Fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p --dangerously-skip-permissions  --max-turns 5 "Analyze the following issue comment and provide a fix in a new branch with a PR: ${{ github.event.comment.body }}"