name: Gemini Issue Fixer
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  gemini-fix:
    if: contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.comment.body, '@gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Aider (The Agent Engine)
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
      - name: Run Gemini Fix
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "gemini-ai@github.com"
          
          BRANCH_NAME="bugfix/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          
          aider --model gemini/gemini-1.5-flash-latest \
            --yes \
            --no-auto-commits \
            --message "Analyze the following issue and provide a fix in a new branch with a PR. Title: ${{ github.event.issue.title }} Description: ${{ github.event.issue.body }}"
          
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --title "Fix: ${{ github.event.issue.title }}" \
            --body "Automated fix for #${{ github.event.issue.number }} generated by Gemini." \
            --base dev \
            --head "$BRANCH_NAME"